<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block extra_meta %}{% endblock %}
    <title>{% block title %}🦷Consultorio Odontológico{% endblock %}</title>
    <!-- icono de la página -->
    <link rel="shortcut icon" href="/static/img/logoConsulOdonto.png"  type="image/x-icon">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- estilos de la navegacion -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <!-- iconos -->
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-straight/css/uicons-solid-straight.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
    <!-- css extra-->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div>
            <a href="{% url 'home' %}"><img src="/static/img/logoConsulOdonto.png" alt="Logo"></a>
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Inicio</a></li>
                <li><a href="{% url 'pacientes:listado' %}">Pacientes</a></li>
                <li><a href="">Inventario</a></li>
                <li><a href="">Turnos</a></li>
                <li>
                    <form action="{% url 'login:logout' %}" method="post" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="btn-logout">Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </nav>
    </header>    
    <!-- Contenido Dinámico -->
    <main>
        {% block content %}{% endblock %}
    </main>
{% block extra_js %}{% endblock %}
</body>
</html>
