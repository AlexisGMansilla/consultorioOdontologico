<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obras Sociales</title>
    <!-- Estilo de DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <!-- Estilo personalizado -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/obra_sociales.css' %}">
</head>
<body>
    <h1 style="text-align: center;">Listado de Obras Sociales</h1>

    <!-- Botón para agregar nueva obra social -->
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="{% url 'crear_obra_social' %}" class="btn btn-success">Agregar Obra Social</a>
    </div>

    <!-- Contenedor de la tabla -->
    <div class="tabla-container" style="margin: 0 auto; width: 80%;">
        <table id="tabla-obras" class="table table-bordered">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Alcance</th>
                    <th>Cobertura (%)</th>
                    <th>Opciones</th>
                </tr>
            </thead>
            <tbody>
                {% for obra in obras %}
                <tr>
                    <td>{{ obra.nombre }}</td>
                    <td>{{ obra.alcance }}</td>
                    <td>{{ obra.cobertura }}</td>
                    <td>
                        <a href="{% url 'editar_obra_social' obra.pk %}" class="btn btn-warning btn-sm">Editar</a>
                        <button onclick="eliminarObra({{ obra.id }})" class="btn btn-danger btn-sm">Eliminar</button>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" style="text-align: center;">No hay datos disponibles</td>
                </tr>
                {% endfor %}
            </tbody>
            
        </table>
    </div>

    <!-- Scripts de DataTables -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script>
        // Función para eliminar una obra social
        function eliminarObra(obraId) {
            if (confirm('¿Estás seguro de eliminar esta obra social?')) {
                fetch(`/obra_sociales/eliminar/${obraId}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                    }
                })
                .then(response => {
                    if (response.ok) {
                        alert('Obra social eliminada correctamente.');
                        location.reload();
                    } else {
                        alert('Ocurrió un error al intentar eliminar la obra social.');
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }

        // Inicialización de DataTables con configuración en español
        $(document).ready(function () {
            $('#tabla-obras').DataTable({
                language: {
                    "lengthMenu": "Mostrar _MENU_ registros por página",
                    "zeroRecords": "No se encontraron resultados",
                    "info": "Mostrando página _PAGE_ de _PAGES_",
                    "infoEmpty": "No hay registros disponibles",
                    "infoFiltered": "(filtrado de _MAX_ registros totales)",
                    "search": "Buscar:",
                    "paginate": {
                        "first": "Primero",
                        "last": "Último",
                        "next": "Siguiente",
                        "previous": "Anterior"
                    },
                    "loadingRecords": "Cargando...",
                    "processing": "Procesando...",
                    "emptyTable": "No hay datos disponibles en la tabla",
                    "thousands": ",",
                    "aria": {
                        "sortAscending": ": activar para ordenar la columna de manera ascendente",
                        "sortDescending": ": activar para ordenar la columna de manera descendente"
                    }
                }
            });
        });
    </script>
</body>
</html>
