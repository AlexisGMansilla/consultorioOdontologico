<!DOCTYPE html>
<html lang="en">
<head>
    <title>Odontograma de {{ paciente.nombre }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/odontograma.css' %}">
</head>
<body>
    <div class="odontograma-container">
        <!-- Títulos de los cuadrantes -->
        <h2 class="cuadrante-titulo" id="titulo-1">1</h2>
        <h2 class="cuadrante-titulo" id="titulo-2">2</h2>
        <h2 class="cuadrante-titulo" id="titulo-4">4</h2>
        <h2 class="cuadrante-titulo" id="titulo-3">3</h2>

        <!-- Línea divisoria vertical -->
        <div class="linea-vertical"></div>
        <!-- Línea divisoria horizontal -->
        <div class="linea-horizontal"></div>

        <div class="odontograma">
            <!-- Cuadrante Superior Izquierdo -->
            <div class="cuadrante" id="superior-izquierdo">
                <div class="fila">
                    <div id="diente-18" class="container"></div>
                    <div id="diente-17" class="container"></div>
                    <div id="diente-16" class="container"></div>
                    <div id="diente-15" class="container"></div>
                    <div id="diente-14" class="container"></div>
                    <div id="diente-13" class="container"></div>
                    <div id="diente-12" class="container"></div>
                    <div id="diente-11" class="container"></div>
                </div>
            </div>

            <!-- Cuadrante Superior Derecho -->
            <div class="cuadrante" id="superior-derecho">
                <div class="fila">
                    <div id="diente-21" class="container"></div>
                    <div id="diente-22" class="container"></div>
                    <div id="diente-23" class="container"></div>
                    <div id="diente-24" class="container"></div>
                    <div id="diente-25" class="container"></div>
                    <div id="diente-26" class="container"></div>
                    <div id="diente-27" class="container"></div>
                    <div id="diente-28" class="container"></div>
                </div>
            </div>

            <!-- Cuadrante Inferior Izquierdo -->
            <div class="cuadrante" id="inferior-izquierdo">
                <div class="fila">
                    <div id="diente-48" class="container"></div>
                    <div id="diente-47" class="container"></div>
                    <div id="diente-46" class="container"></div>
                    <div id="diente-45" class="container"></div>
                    <div id="diente-44" class="container"></div>
                    <div id="diente-43" class="container"></div>
                    <div id="diente-42" class="container"></div>
                    <div id="diente-41" class="container"></div>
                </div>
            </div>

            <!-- Cuadrante Inferior Derecho -->
            <div class="cuadrante" id="inferior-derecho">
                <div class="fila">
                    <div id="diente-31" class="container"></div>
                    <div id="diente-32" class="container"></div>
                    <div id="diente-33" class="container"></div>
                    <div id="diente-34" class="container"></div>
                    <div id="diente-35" class="container"></div>
                    <div id="diente-36" class="container"></div>
                    <div id="diente-37" class="container"></div>
                    <div id="diente-38" class="container"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="referencias-colores">
        <h3>Referencias</h3>
        <ul>
            <li><span class="color-sano"></span> Sano</li>
            <li><span class="color-caries"></span> Caries</li>
            <li><span class="color-restaurado"></span> Restaurado</li>
            <li><span class="color-ausente"></span> Ausente</li>
        </ul>
    </div>

    <button onclick="guardarOdontograma()" class="btn btn-primary">Guardar Cambios</button>

    <script>
        // Función para inicializar los dientes con funcionalidad
        function crearDiente(id) {
            const container = document.getElementById(id);

            const numeroDiente = document.createElement('div');
            numeroDiente.className = 'numero-diente';
            numeroDiente.innerText = id.split('-')[1]; // Número del diente
            container.appendChild(numeroDiente);

            const caras = ['arriba', 'abajo', 'izquierda', 'derecha', 'cuadrado-central'];
            caras.forEach(cara => {
                const hexagono = document.createElement('div');
                hexagono.className = cara === 'cuadrado-central' ? 'cuadrado-central' : 'hexagono ' + cara;
                hexagono.addEventListener('click', (event) => abrirMenuEmergente(event, hexagono));
                container.appendChild(hexagono);
            });

            const menuEmergente = document.createElement('div');
            menuEmergente.className = 'menu-emergente';
            const select = document.createElement('select');
            const opciones = ['Sano', 'Caries', 'Restaurado', 'Ausente'];
            opciones.forEach(opcion => {
                const opt = document.createElement('option');
                opt.value = opcion;
                opt.textContent = opcion;
                select.appendChild(opt);
            });

            select.addEventListener('change', (event) => cambiarDiagnostico(event, container));
            menuEmergente.appendChild(select);
            container.appendChild(menuEmergente);
        }

        function cambiarDiagnostico(event, container) {
            const colorDiagnostico = {
                'Sano': '#2ecc71',
                'Caries': '#e74c3c',
                'Restaurado': '#f39c12',
                'Ausente': '#7f8c8d'
            };
            const caraSeleccionada = container.querySelector('.hexagono.selected, .cuadrado-central.selected');
            caraSeleccionada.style.backgroundColor = colorDiagnostico[event.target.value];
            container.querySelector('.menu-emergente').style.display = 'none';
        }

        function abrirMenuEmergente(event, hexagono) {
            const menuEmergente = hexagono.parentElement.querySelector('.menu-emergente');
            document.querySelectorAll('.menu-emergente').forEach(menu => menu.style.display = 'none');
            menuEmergente.style.display = 'block';
            hexagono.parentElement.querySelectorAll('.hexagono, .cuadrado-central').forEach(cara => {
                cara.classList.remove('selected');
            });
            hexagono.classList.add('selected');
        }

        // Función para guardar el estado del odontograma
        function guardarOdontograma() {
    const odontograma = {
        "superior_izquierdo": [],
        "superior_derecho": [],
        "inferior_izquierdo": [],
        "inferior_derecho": []
    };

    // Recolecta datos de cada cuadrante
    document.querySelectorAll('.container').forEach((diente) => {
        const numero = diente.id.split('-')[1]; // Número del diente
        const estado = diente.getAttribute('data-estado') || "Sano";

        if (parseInt(numero) >= 11 && parseInt(numero) <= 18) {
            odontograma.superior_izquierdo.push({ numero, estado });
        } else if (parseInt(numero) >= 21 && parseInt(numero) <= 28) {
            odontograma.superior_derecho.push({ numero, estado });
        } else if (parseInt(numero) >= 31 && parseInt(numero) <= 38) {
            odontograma.inferior_derecho.push({ numero, estado });
        } else if (parseInt(numero) >= 41 && parseInt(numero) <= 48) {
            odontograma.inferior_izquierdo.push({ numero, estado });
        }
    });

    // Enviar los datos al servidor
    fetch(window.location.href, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken') // Asegúrate de que este método obtiene el token
        },
        body: JSON.stringify({ odontograma }) // Enviando el JSON
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Error en la respuesta del servidor.');
        }
        return response.json();
    })
    .then(data => {
        alert(data.message); // Mensaje del servidor
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Hubo un error al guardar los datos.');
    });
}

// Función para obtener el CSRF Token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}


        // Crear los dientes en el odontograma
        const dientes = [
            '18', '17', '16', '15', '14', '13', '12', '11',
            '21', '22', '23', '24', '25', '26', '27', '28',
            '48', '47', '46', '45', '44', '43', '42', '41',
            '31', '32', '33', '34', '35', '36', '37', '38'
        ];
        dientes.forEach(diente => crearDiente(`diente-${diente}`));
    </script>
</body>
</html>
