{% extends 'base.html' %}
{% load static %}

{% block title %}Agregar Turno{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'turnos/css/turnos_form.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
{% endblock %}

{% block content %}
<div class="container-form">
    <h1>Agregar Turno</h1>
    <form method="post" class="form">
        {% csrf_token %}
        <div class="form-group">
            <label for="paciente">Paciente:</label>
            <select name="paciente" id="paciente" class="form-control">
                {% for paciente in pacientes %}
                <option value="{{ paciente.id }}">{{ paciente.nombre }} {{ paciente.apellido }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" name="fecha" id="fecha" value="{{ fecha_inicial }}" required class="form-control">
        </div>
        
        <div class="form-group">
            <label for="hora">Hora:</label>
            <input type="time" name="hora" id="hora" required class="form-control">
        </div>
        
        <div class="form-group">
            <label for="motivo">Motivo:</label>
            <textarea name="motivo" id="motivo" class="form-control"></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'turnos:vista_calendario' %}" class="btn btn-secondary">Volver al calendario</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Inicializar Flatpickr para el campo de fecha
        flatpickr("[name='fecha']", {
            enableTime: false,
            dateFormat: "Y-m-d",
            defaultDate: "{{ turno.fecha|date:'Y-m-d' }}",
        });

        // Inicializar Flatpickr para el campo de hora
        flatpickr("[name='hora']", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            defaultDate: "{{ turno.hora|date:'H:i' }}",
        });
    });
</script>
{% endblock %}
